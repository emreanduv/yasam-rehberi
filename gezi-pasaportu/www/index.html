<div id="app">
  <header class="band">

    <div class="band-txt">
      <h1 id="hBaslik">Pasaportum</h1>
      <div class="band-sub" id="hAlt">hazırlanıyor…</div>

  <main id="ekran"></main>

  <button class="fab" id="fab" aria-label="Seyahat ekle" hidden>＋</button>

  <nav class="tabbar" id="tabbar">
    <button data-s="pasaport" class="on"><i>🛂</i><span>Pasaport</span></button>
    <button data-s="harita"><i>🗺️</i><span>Harita</span></button>
    <button data-s="seyahat"><i>✈️</i><span>Seyahatler</span></button>
    <button data-s="ulkeler"><i>🏳️</i><span>Ülkeler</span></button>
    <button data-s="bilgi"><i>☰</i><span>Daha</span></button>
  </nav>

  <div class="sheet" id="sheet" hidden><div class="sheet-bg" data-kapat></div><div class="sheet-in" id="sheetIn"></div></div>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="dosya" accept="application/json,.json,.txt" hidden>
</div>
<script>(function () {

  "gizlilik": "https://emreanduv.github.io/yasam-rehberi/gezi-pasaportu/gizlilik.html", "sira": ["pasaport", "harita", "seyahat", "ulkeler", "bilgi"]};
 var tr = {"ad": "Gezi Pasaportu",

   "harita": ["Dünya haritan", "Gittiğin ülkeler yeşil, hayal listen turuncu, ev ülken altın. İki parmakla yaklaş, sürükle; bir ülkeye dokununca sayfası açılır."],
   "seyahat": ["Seyahatlerin", "Her seyahatin tarihi, şehirleri, kiminle gittiğin ve notunla yıllara göre dizilir. Tarihi tam hatırlamıyorsan yalnız yılı seçmen yeter."],
   "ulkeler": ["Hızlı işaretle", "Ara kutusuna ülke ya da şehir yaz. ✓ ile 'gittim', ☆ ile 'hayalim' yaparsın; ülkenin adına dokununca sayfası açılır."],
   "bilgi": ["Dil, yedek ve ayarlar", "Dili buradan değiştirirsin. Yedekle ile bütün pasaportun tek dosya olur; yeni telefonda Geri yükle ile geri gelir."]}};
 var enT = {"ad": "Travel Passport",
