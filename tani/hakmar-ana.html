    <script>
      // Admin panelinde kayıtlı yakınlaştırma tercihini React mount'undan ÖNCE
      // uygula; aksi halde sayfa %100'de boyanıp sonra zıplar. Anahtar,
      // ZoomControl/zoom.ts ile ORTAK. Yalnız /derinadmin altında çalışır —
      // mağaza tarafı bu zoom'dan etkilenmemeli.
      (function () {
        try {
          if (!location.pathname.startsWith('/derinadmin')) return;
          var z = localStorage.getItem('eshopAdminZoom');
          if (!z) return;
          document.documentElement.style.setProperty('zoom', z);
          document.documentElement.style.setProperty('--eshop-zoom', z);
        } catch (e) {
          /* localStorage erişilemiyorsa zoom uygulanmaz */
        }
      })();
    </script>
