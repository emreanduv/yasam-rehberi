name: Android (Google Play paketi)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm adı (ör. 1.0.0)"
        default: "1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: AAB derle (imzasız; imza ayrı yapılır)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: chmod +x gradlew && ./gradlew :app:bundleRelease --no-daemon
      - name: Wear OS saat paketi (imzasız)
        id: wear
        continue-on-error: true
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew :wear:bundleRelease --no-daemon
      - name: Paketi builds dalına koy
        run: |
          OUT=yasam-rehberi-${{ inputs.version_name }}-${{ github.run_number }}-unsigned.aab
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/$OUT
          mkdir -p /tmp/b/android && cp /tmp/$OUT /tmp/b/android/ && cd /tmp/b
          git init -q -b builds && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Android paketi $OUT"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
      - uses: actions/upload-artifact@v4
        with:
          name: yasam-rehberi-${{ inputs.version_name }}-${{ github.run_number }}-unsigned.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.wear.outcome == 'success'
        with:
          name: yasam-rehberi-wear-${{ inputs.version_name }}-${{ github.run_number }}-unsigned.aab
          path: android/wear/build/outputs/bundle/release/wear-release.aab
