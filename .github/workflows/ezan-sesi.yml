name: Ezan sesi (Wikimedia Commons — özgür lisanslı kayıt)
on:
  workflow_dispatch:
    inputs:
      dosya: { description: "Boş = adayları listele. Dolu = bu Commons dosyasını indir, 30 sn'lik bildirim sesi yap ve depoya ekle (ör. File:Adhan.ogg)", default: "" }
      bas: { description: "Kırpma başlangıcı (sn)", default: "0" }
permissions: { contents: write }
jobs:
  is:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adayları listele
        if: ${{ inputs.dosya == '' }}
        run: python tools/ezan_ara.py
      - name: İndir ve dönüştür
        if: ${{ inputs.dosya != '' }}
        env: { DOSYA: "${{ inputs.dosya }}", BAS: "${{ inputs.bas }}" }
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          python tools/ezan_ara.py >/dev/null
          python - <<'PY'
          import json, os, urllib.request
          d = os.environ["DOSYA"]; r = next(x for x in json.load(open("ezan-adaylar.json")) if x["baslik"] == d)
          assert r["lisans"] in ("Public domain", "CC0", "CC BY 4.0", "CC BY-SA 4.0", "CC BY 3.0", "CC BY-SA 3.0", "CC BY 2.0", "CC BY-SA 2.0"), r["lisans"]
          urllib.request.urlretrieve(urllib.request.Request(r["url"], headers={"User-Agent": "YasamRehberi/1.3 (Mr. Anduv!)"}).full_url, "kaynak")
          json.dump(r, open("kaynak.json", "w"), ensure_ascii=False, indent=1)
          PY
          mkdir -p ios/App/App android/app/src/main/res/raw store/ses
          # 30 sn (iOS bildirim sınırı), sonu yumuşak kapanış, ses seviyesi dengeli
          F="atrim=start=${BAS}:duration=29.5,asetpts=N/SR/TB,loudnorm=I=-16:TP=-1.5,afade=t=in:d=0.3,afade=t=out:st=27:d=2.5"
          ffmpeg -loglevel error -y -i kaynak -af "$F" -ac 1 -ar 44100 -c:a pcm_s16le ios/App/App/ezan.wav
          ffmpeg -loglevel error -y -i kaynak -af "$F" -ac 1 -ar 44100 -c:a libvorbis -q:a 4 android/app/src/main/res/raw/ezan.ogg
          cp kaynak.json store/ses/ezan-kaynak.json
          ls -la ios/App/App/ezan.wav android/app/src/main/res/raw/ezan.ogg; cat store/ses/ezan-kaynak.json
          git config user.name "Mr. Anduv!"; git config user.email emreanduv@hotmail.com
          git add ios/App/App/ezan.wav android/app/src/main/res/raw/ezan.ogg store/ses/ezan-kaynak.json
          git commit -m "Ezan bildirim sesi: $DOSYA (Wikimedia Commons, özgür lisans)" && git push
